<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaktrack Employee Scheduler</title>
  <style>
    :root {
      --bg: #f5f6f6;
      --panel: #ffffff;
      --text: #25282b;
      --muted: #6f767b;
      --border: #e5e8ea;
      --accent: #622c90;
      --accent-soft: #f2edf7;
      --danger: #b93b4d;
      --shadow: 0 8px 30px rgba(37, 40, 43, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 24px 32px;
      background: linear-gradient(135deg, #251a4d, #622c90);
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    main {
      padding: 24px 32px 40px;
      display: grid;
      gap: 20px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .filters, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
    }

    .metric {
      padding: 16px;
      border-radius: 16px;
      background: #f5f6f6;
      border: 1px solid var(--border);
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric .value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    button, select, input {
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: white;
      color: var(--text);
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 700;
    }

    button.secondary {
      background: white;
      color: var(--text);
      border-color: var(--border);
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    button:hover { filter: brightness(0.97); }

    .grid {
      display: grid;
      grid-template-columns: minmax(360px, 430px) 1fr;
      gap: 20px;
      align-items: start;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .form {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * { flex: 1; }

    .list {
      display: grid;
      gap: 8px;
    }

    .person {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfcfc;
      overflow: hidden;
    }

    .person > div:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .person small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }

    .person-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .person-actions button {
      padding: 8px 10px;
      white-space: nowrap;
    }

    .form input,
    .form select {
      min-width: 0;
      width: 100%;
    }

    .schedule-wrap {
      overflow: auto;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 980px;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px;
      vertical-align: top;
      background: white;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f6f6;
      text-align: left;
      font-size: 13px;
      color: var(--muted);
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #f5f6f6;
      min-width: 190px;
      font-weight: 700;
    }

    th:first-child { z-index: 3; }

    .cell {
      display: grid;
      gap: 6px;
      min-height: 116px;
    }

    .cell select, .cell input {
      width: 100%;
      padding: 7px 8px;
      border-radius: 10px;
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 800;
      color: white;
      width: fit-content;
    }

    .Working { background: #61a63a; }
    .Travel { background: #28b6ea; }
    .Vacation { background: #b93b4d; }
    .Sick { background: #c77b16; }
    .Training { background: #009a66; }
    .Off { background: #52575b; }
    .Unassigned { background: #cad0d3; }

    .hours {
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar-note {
      color: var(--muted);
      font-size: 13px;
    }

    .hidden { display: none; }

    @media (max-width: 900px) {
      main { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, 1fr); }
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px;
      width: fit-content;
      max-width: 100%;
      background: #edf0f1;
      border-radius: 14px;
    }
    .view-tab { background: transparent; color: var(--text); border-color: transparent; padding: 9px 14px; }
    .view-tab.active { background: var(--panel); color: var(--accent); border-color: var(--border); box-shadow: 0 2px 8px rgba(37,40,43,.08); }
    .view-panel.hidden, .hidden { display: none !important; }
    .edit-actions { display:grid; grid-template-columns:1fr auto; gap:8px; }
    .edit-actions .secondary { min-width:90px; }
    .compact-card { padding: 16px; }
    .compact-schedule { display: grid; gap: 6px; margin-top: 12px; }
    .compact-row { display: grid; grid-template-columns: minmax(150px,1.4fr) repeat(7,minmax(72px,1fr)); gap: 6px; align-items: stretch; }
    .compact-cell { min-width: 0; padding: 7px 8px; border: 1px solid var(--border); border-radius: 10px; background: #fcfcfc; font-size: 12px; overflow-wrap: anywhere; }
    .compact-cell.employee { font-weight: 700; background: #f5f6f6; }
    .compact-cell.employee small { display:block; color:var(--muted); margin-top:2px; font-weight:400; }
    .compact-cell.day-header { font-weight: 700; color: var(--muted); text-align:center; background:#f5f6f6; }
    .compact-status { display:block; width:100%; border-radius:8px; padding:6px 4px; text-align:center; font-size:11px; font-weight:800; color:white; line-height:1.1; }
    .compact-site { display:block; margin-top:3px; color:var(--muted); text-align:center; font-size:10px; line-height:1.1; }

    .schedule-wrap { overflow: visible; width:100%; }
    table { table-layout: fixed; min-width:0; width:100%; }
    th:first-child, td:first-child { min-width:0; width:16%; }
    th, td { min-width:0; overflow-wrap:anywhere; padding:7px; }
    .cell { min-height:0; }
    .cell .row { flex-direction:column; }

    @media (max-width:1200px) {
      main { padding-left:18px; padding-right:18px; }
      .grid { grid-template-columns:minmax(300px,360px) minmax(0,1fr); }
      .cell select, .cell input { font-size:12px; padding:6px; }
    }
    @media (max-width:900px) {
      .grid { grid-template-columns:1fr; }
      table, thead, tbody, th, td, tr { display:block; }
      thead { display:none; }
      tr { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:14px; padding:10px; border:1px solid var(--border); border-radius:14px; background:#f5f6f6; }
      td { border:1px solid var(--border); border-radius:10px; position:static !important; width:auto !important; }
      td:first-child { grid-column:1/-1; }
      td:not(:first-child)::before { content:attr(data-day); display:block; margin-bottom:6px; color:var(--muted); font-size:11px; font-weight:700; }
      .compact-row { grid-template-columns:minmax(130px,1.2fr) repeat(7,minmax(60px,1fr)); gap:4px; }
      .compact-cell { padding:6px 4px; font-size:11px; }
    }
    @media (max-width:640px) {
      .summary { grid-template-columns:1fr 1fr; }
      tr { grid-template-columns:1fr; }
      td:first-child { grid-column:auto; }
      .compact-row { grid-template-columns:110px repeat(7,minmax(0,1fr)); }
      .compact-cell { padding:5px 2px; font-size:10px; }
      .compact-status { padding:5px 2px; font-size:9px; }
      .compact-site { font-size:8px; }
    }


    .today-summary {
      padding: 14px 16px;
    }

    .today-summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .today-summary h2 {
      margin-bottom: 2px;
    }

    .today-metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 1fr));
      gap: 8px;
    }

    .today-metric {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fcfcfc;
    }

    .today-metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .today-metric-value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .site-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f2edf7;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      vertical-align: middle;
      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #f5f6f6;
      box-shadow: inset 0 -1px 0 var(--border);
    }

    tbody tr {
      transition: background-color .15s ease, box-shadow .15s ease;
    }

    tbody tr:hover td {
      background: #faf7fc;
    }

    tbody tr:hover td:first-child {
      background: #f2edf7;
    }

    .compact-row.data-row {
      transition: background-color .15s ease;
      border-radius: 10px;
    }

    .compact-row.data-row:hover .compact-cell {
      background: #faf7fc;
    }

    .compact-row.data-row:hover .compact-cell.employee {
      background: #f2edf7;
    }

    @media (max-width: 900px) {
      .today-metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      thead th {
        position: static;
        box-shadow: none;
      }
    }

    @media (max-width: 520px) {
      .today-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .today-metric {
        padding: 9px 10px;
      }

      .today-metric-value {
        font-size: 20px;
      }
    }


    .combined-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
      padding: 16px 20px;
    }

    .summary-group {
      min-width: 0;
    }

    .summary-group-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }

    .summary-group-heading h2 {
      margin: 0;
      white-space: nowrap;
    }

    .summary-divider {
      width: 1px;
      background: var(--border);
    }

    .compact-metrics {
      grid-template-columns: repeat(6, minmax(64px, 1fr));
      gap: 6px;
    }

    .combined-summary .today-metric,
    .combined-summary .metric {
      padding: 8px 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      position: relative;
    }

    .combined-summary .today-metric:not(:last-child)::after,
    .combined-summary .metric:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 15%;
      right: -3px;
      width: 1px;
      height: 70%;
      background: var(--border);
    }

    .combined-summary .today-metric-label,
    .combined-summary .metric .label {
      font-size: 11px;
      margin-bottom: 4px;
    }

    .combined-summary .today-metric-value,
    .combined-summary .metric .value {
      font-size: 21px;
    }

    .weekly-metrics {
      grid-template-columns: repeat(4, minmax(80px, 1fr));
      gap: 6px;
      margin: 0;
    }

    @media (max-width: 1100px) {
      .combined-summary {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .summary-divider {
        width: 100%;
        height: 1px;
      }
    }

    @media (max-width: 720px) {
      .combined-summary {
        padding: 14px;
      }

      .summary-group-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .compact-metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .weekly-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .combined-summary .today-metric:nth-child(3)::after,
      .combined-summary .metric:nth-child(2)::after {
        display: none;
      }
    }


    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(280px, 1fr) auto;
      align-items: center;
      gap: 22px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(37,40,43,.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-weight: 900;
      font-size: 18px;
    }

    .app-header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
    }

    .header-tabs {
      display: flex;
      align-self: stretch;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .header-tab {
      position: relative;
      height: 100%;
      padding: 0 14px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .header-tab::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -10px;
      height: 3px;
      border-radius: 999px;
      background: transparent;
    }

    .header-tab.active {
      color: var(--accent);
      background: transparent;
    }

    .header-tab.active::after {
      background: var(--accent);
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .week-control {
      display: grid;
      grid-template-columns: 38px minmax(155px, 1fr) 38px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      overflow: hidden;
    }

    .icon-button {
      min-width: 0;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font-size: 17px;
    }

    .icon-button:first-child {
      border-right: 1px solid var(--border);
    }

    .icon-button:last-child {
      border-left: 1px solid var(--border);
    }

    .week-picker {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 0 10px;
    }

    .calendar-icon {
      color: var(--muted);
      font-size: 13px;
    }

    .week-picker input {
      min-width: 0;
      width: 100%;
      padding: 8px 0;
      border: 0;
      background: transparent;
      font-weight: 700;
    }

    .header-site-filter {
      min-width: 260px;
      width: auto;
      padding: 9px 34px 9px 12px;
      font-weight: 700;
    }

    .utility-menu {
      position: relative;
    }

    .utility-menu summary {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-weight: 900;
      list-style: none;
    }

    .utility-menu summary::-webkit-details-marker {
      display: none;
    }

    .utility-menu-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      display: grid;
      gap: 8px;
      min-width: 150px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px rgba(37,40,43,.14);
    }

    .utility-menu-panel button {
      width: 100%;
      white-space: nowrap;
    }

    @media (max-width: 1050px) {
      .app-header {
        grid-template-columns: auto 1fr;
        gap: 10px 18px;
      }

      .header-tabs {
        justify-self: end;
      }

      .header-controls {
        grid-column: 1 / -1;
        justify-content: stretch;
      }

      .week-control {
        flex: 1 1 auto;
      }

      .header-site-filter {
        flex: 0 1 190px;
      }
    }

    @media (max-width: 680px) {
      .app-header {
        position: static;
        grid-template-columns: 1fr;
        padding: 12px 14px;
      }

      .brand {
        justify-content: center;
      }

      .header-tabs {
        justify-self: stretch;
        justify-content: center;
        min-height: 42px;
      }

      .header-tab::after {
        bottom: -5px;
      }

      .header-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .week-control {
        grid-column: 1 / -1;
      }

      .header-site-filter {
        min-width: 0;
        width: 100%;
      }
    }


    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .app-header {
      flex: 0 0 auto;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .combined-summary {
      flex: 0 0 auto;
    }

    #detailedView {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    #detailedView > .grid {
      height: 100%;
      min-height: 0;
      align-items: stretch;
    }

    #detailedView aside.card {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .fixed-schedule-card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .schedule-card-heading {
      flex: 0 0 auto;
      padding-bottom: 10px;
    }

    .schedule-scroll-region {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .schedule-scroll-region table {
      border-collapse: separate;
      border-spacing: 0;
    }

    .schedule-scroll-region thead th {
      position: sticky;
      top: 0;
      z-index: 8;
      background: #f5f6f6;
    }

    .schedule-scroll-region thead th:first-child {
      left: 0;
      z-index: 10;
    }

    .schedule-scroll-region tbody td:first-child {
      position: sticky;
      left: 0;
      z-index: 6;
      background: #f5f6f6;
      box-shadow: 1px 0 0 var(--border);
    }

    .schedule-scroll-region tbody tr:hover td:first-child {
      background: #f2edf7;
    }

    #compactView {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    @media (max-width: 900px) {
      html,
      body {
        height: auto;
        overflow: auto;
      }

      body {
        display: block;
      }

      main,
      #detailedView,
      #detailedView > .grid,
      .fixed-schedule-card {
        height: auto;
        overflow: visible;
      }

      #detailedView aside.card,
      .schedule-scroll-region,
      #compactView {
        overflow: visible;
      }

      .schedule-scroll-region {
        border: 0;
      }

      .schedule-scroll-region thead th,
      .schedule-scroll-region thead th:first-child,
      .schedule-scroll-region tbody td:first-child {
        position: static;
        box-shadow: none;
      }
    }


    /* Version 16: fixed app shell with independently scrolling schedule */
    @media (min-width: 901px) {
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
      }

      body {
        display: flex !important;
        flex-direction: column;
      }

      .app-header {
        flex: 0 0 auto;
      }

      main {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        height: auto !important;
        overflow: hidden !important;
        display: grid !important;
        grid-template-rows: auto minmax(0, 1fr) !important;
        gap: 14px !important;
        padding: 14px 20px 18px !important;
      }

      .combined-summary {
        min-height: 0;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      #detailedView {
        display: block;
        min-height: 0 !important;
        height: 100%;
        overflow: hidden !important;
      }

      #detailedView.hidden {
        display: none;
      }

      #detailedView > .grid {
        display: grid;
        grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
        height: 100%;
        min-height: 0;
        gap: 14px;
        align-items: stretch;
      }

      #detailedView > .grid > aside.card {
        height: 100%;
        min-height: 0;
        overflow-y: auto !important;
        overflow-x: hidden;
        overscroll-behavior: contain;
      }

      .fixed-schedule-card {
        height: 100%;
        min-height: 0;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column;
      }

      .schedule-card-heading {
        flex: 0 0 auto;
        padding-bottom: 10px;
      }

      .schedule-card-heading h2 {
        margin-bottom: 4px;
      }

      .schedule-scroll-region {
        flex: 1 1 0;
        height: 0;
        min-height: 0;
        overflow-y: scroll !important;
        overflow-x: auto !important;
        overscroll-behavior: contain;
        scrollbar-gutter: stable both-edges;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .schedule-scroll-region table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .schedule-scroll-region thead th {
        position: sticky !important;
        top: 0;
        z-index: 12;
        background: #f5f6f6 !important;
        box-shadow: inset 0 -1px 0 var(--border);
      }

      .schedule-scroll-region thead th:first-child {
        left: 0;
        z-index: 14;
      }

      .schedule-scroll-region tbody td:first-child {
        position: sticky !important;
        left: 0;
        z-index: 9;
        background: #f5f6f6;
        box-shadow: 1px 0 0 var(--border);
      }

      .schedule-scroll-region tbody tr:hover td:first-child {
        background: #f2edf7;
      }

      #compactView {
        min-height: 0;
        overflow-y: auto !important;
      }
    }


    /* Version 17: Compact View uses the same frozen-header scrolling model */
    @media (min-width: 901px) {
      #compactView {
        display: block;
        height: 100%;
        min-height: 0;
        overflow: hidden !important;
      }

      #compactView.hidden {
        display: none;
      }

      #compactView > .compact-card {
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #compactView > .compact-card > h2,
      #compactView > .compact-card > .toolbar-note {
        flex: 0 0 auto;
      }

      #compactSchedule {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto !important;
        overscroll-behavior: contain;
        scrollbar-gutter: stable both-edges;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        background: white;
      }

      #compactSchedule .compact-row:first-child {
        position: sticky;
        top: 0;
        z-index: 12;
        background: white;
        padding-bottom: 4px;
      }

      #compactSchedule .compact-row:first-child .compact-cell {
        background: #f5f6f6;
        box-shadow: inset 0 -1px 0 var(--border);
      }

      #compactSchedule .compact-row .compact-cell:first-child {
        position: sticky;
        left: 0;
        z-index: 8;
        background: #f5f6f6;
        box-shadow: 1px 0 0 var(--border);
      }

      #compactSchedule .compact-row:first-child .compact-cell:first-child {
        z-index: 14;
      }

      #compactSchedule .compact-row.data-row:hover .compact-cell:first-child {
        background: #f2edf7;
      }
    }

    @media (max-width: 900px) {
      #compactSchedule {
        overflow: visible;
        border: 0;
        padding: 0;
      }

      #compactSchedule .compact-row:first-child,
      #compactSchedule .compact-row .compact-cell:first-child {
        position: static;
        box-shadow: none;
      }
    }


    .OFF {
      background: #000000;
    }

    .tech-type-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f2edf7;
      color: #622c90;
      font-size: 10px;
      font-weight: 800;
      vertical-align: middle;
      white-space: nowrap;
    }

    .header-controls .header-site-filter {
      max-width: 260px;
    }

    .compact-metrics {
      grid-template-columns: repeat(7, minmax(58px, 1fr));
    }

    .weekly-metrics {
      grid-template-columns: repeat(3, minmax(100px, 1fr));
    }

    @media (max-width: 720px) {
      .compact-metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }


    .field-label {
      display: grid;
      gap: 4px;
      min-width: 0;
      flex: 1;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .field-label input {
      width: 100%;
      color: var(--text);
      font-size: initial;
      font-weight: 400;
    }

    .roster-secondary-fields {
      align-items: end;
    }

    .management-panel {
      position: relative;
      transition:
        width .2s ease,
        min-width .2s ease,
        padding .2s ease,
        opacity .15s ease;
    }

    .management-panel-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 28px;
      margin: -4px 0 8px;
    }

    .management-panel-header .panel-title {
      display: none;
      margin-right: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .panel-collapse-button,
    .panel-expand-button {
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      white-space: nowrap;
    }

    .panel-collapse-button {
      width: 34px;
      height: 30px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .schedule-heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    #schedulerGrid {
      transition: grid-template-columns .2s ease;
    }

    #schedulerGrid.management-collapsed {
      grid-template-columns: 0 minmax(0, 1fr) !important;
      gap: 0 !important;
    }

    #schedulerGrid.management-collapsed .management-panel {
      width: 0;
      min-width: 0;
      padding-left: 0;
      padding-right: 0;
      border-width: 0;
      opacity: 0;
      overflow: hidden !important;
      pointer-events: none;
    }

    @media (min-width: 901px) {
      #schedulerGrid.management-collapsed .fixed-schedule-card {
        grid-column: 2;
      }
    }

    @media (max-width: 900px) {
      .management-panel-header {
        justify-content: space-between;
      }

      .management-panel-header .panel-title {
        display: inline;
      }

      .panel-collapse-button,
      .panel-expand-button {
        display: none !important;
      }

      #schedulerGrid.management-collapsed {
        grid-template-columns: 1fr !important;
        gap: 20px !important;
      }

      #schedulerGrid.management-collapsed .management-panel {
        width: auto;
        min-width: 0;
        padding: 18px;
        border-width: 1px;
        opacity: 1;
        overflow: visible !important;
        pointer-events: auto;
      }
    }

  
    .panel-collapse-button{
      width:auto;
      min-width:110px;
      padding:6px 12px;
      font-size:13px;
      font-weight:700;
    }

    .schedule-heading-row{
      justify-content:flex-start;
    }

    .schedule-heading-row > div{
      margin-left:12px;
    }

    .panel-expand-button{
      order:-1;
      margin-right:12px;
    }

</style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div>
        <h1>Technician Scheduler</h1>
      </div>
    </div>

    <nav class="header-tabs" aria-label="Schedule views">
      <button id="detailedTab" class="header-tab active" type="button" onclick="setView('detailed')">Weekly Schedule</button>
      <button id="compactTab" class="header-tab" type="button" onclick="setView('compact')">Compact View</button>
    </nav>

    <div class="header-controls">
      <div class="week-control">
        <button class="icon-button" type="button" onclick="changeWeek(-7)" aria-label="Previous week">←</button>
        <label class="week-picker">
          <span class="calendar-icon" aria-hidden="true">▣</span>
          <input type="date" id="weekStart" onchange="setWeekFromInput()" aria-label="Week starting date" />
        </label>
        <button class="icon-button" type="button" onclick="changeWeek(7)" aria-label="Next week">→</button>
      </div>

      <select id="siteFilter" class="header-site-filter" onchange="render()" aria-label="Filter by site"></select>
      <select id="techTypeFilter" class="header-site-filter" onchange="render()" aria-label="Filter by technician type">
        <option value="">All Tech Types</option>
        <option value="Air">Air</option>
        <option value="Chiller">Chiller</option>
      </select>

      <details class="utility-menu">
        <summary aria-label="Data options">•••</summary>
        <div class="utility-menu-panel">
          <button type="button" onclick="exportData()">Export Data</button>
          <button type="button" class="secondary" onclick="document.getElementById('importFile').click()">Import Data</button>
        </div>
      </details>
      <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)" />
    </div>
  </header>

  <main>

    <section class="combined-summary card">
      <div class="summary-group today-group">
        <div class="summary-group-heading">
          <h2>Today's Schedule</h2>
          <div id="todayDateLabel" class="toolbar-note"></div>
        </div>
        <div id="todayMetrics" class="today-metrics compact-metrics"></div>
      </div>

      <div class="summary-divider" aria-hidden="true"></div>

      <div class="summary-group weekly-group">
        <div class="summary-group-heading">
          <h2>Weekly Summary</h2>
          <div id="weekDateLabel" class="toolbar-note"></div>
        </div>
        <div class="summary weekly-metrics">
          <div class="metric">
            <div class="label">Unassigned Days</div>
            <div id="metricUnassigned" class="value">0</div>
          </div>
          <div class="metric">
            <div class="label">Travel Days</div>
            <div id="metricTravel" class="value">0</div>
          </div>
          <div class="metric">
            <div class="label">Vacation Days</div>
            <div id="metricVacation" class="value">0</div>
          </div>
        </div>
      </div>
    </section>
<section id="detailedView" class="view-panel">
    <section id="schedulerGrid" class="grid">
      <aside id="managementPanel" class="card management-panel">
        <div class="management-panel-header">
          <span class="panel-title">Roster & Sites</span>
          <button id="collapsePanelButton" class="panel-collapse-button" type="button" onclick="toggleManagementPanel()" aria-expanded="true" aria-label="Collapse roster and sites panel">‹</button>
        </div>
        <h2>Employee Roster</h2>
        <div class="form">
          <input id="employeeName" placeholder="Employee name" />
          <div class="row">
            <input id="employeeRole" placeholder="Role / skill" />
            <select id="employeeHomeSite"></select>
          </div>
          <div class="row roster-secondary-fields">
            <select id="employeeTechType" aria-label="Technician type">
              <option value="Air">Air</option>
              <option value="Chiller">Chiller</option>
            </select>
            <label class="field-label">
              <span>Home City</span>
              <input id="employeeHomeCity" placeholder="Enter city" />
            </label>
          </div>
          <div class="edit-actions">
            <button id="employeeSaveButton" onclick="saveEmployee()">Add Employee</button>
            <button id="employeeCancelButton" class="secondary hidden" onclick="cancelEmployeeEdit()">Cancel</button>
          </div>
        </div>
        <div class="list" id="employeeList"></div>

        <hr style="border:0;border-top:1px solid var(--border);margin:18px 0;">

        <h2>Sites</h2>
        <div class="form">
          <input id="siteName" placeholder="Site name" />
          <div class="edit-actions">
            <button id="siteSaveButton" onclick="saveSite()">Add Site</button>
            <button id="siteCancelButton" class="secondary hidden" onclick="cancelSiteEdit()">Cancel</button>
          </div>
        </div>
        <div class="list" id="siteList"></div>
      </aside>

      <section class="card fixed-schedule-card">
        <div class="schedule-card-heading">
          <div class="schedule-heading-row">
            <div>
              <h2>Weekly Schedule</h2>
              <div class="toolbar-note">Changes save automatically in this browser.</div>
            </div>
            <button id="expandPanelButton" class="panel-expand-button hidden" type="button" onclick="toggleManagementPanel()" aria-label="Show roster and sites panel">Show Roster ›</button>
          </div>
        </div>
        <div class="schedule-wrap schedule-scroll-region">
          <table id="scheduleTable"></table>
        </div>
      </section>
    </section>
    </section>

    <section id="compactView" class="view-panel hidden">
      <section class="card compact-card">
        <h2>Weekly Employee Status</h2>
        <div class="toolbar-note">Condensed status view for the selected week and site.</div>
        <div id="compactSchedule" class="compact-schedule"></div>
      </section>
    </section>
  </main>

  <script>
    const statuses = ["Working", "Unassigned", "OFF", "Travel", "Vacation", "Sick", "Training"];
    const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    const demoData = {
      sites: [
        { id: "site-mesa", name: "Mesa" },
        { id: "site-llano", name: "Llano" },
        { id: "site-tor1a", name: "TOR1A" }
      ],
      employees: [
        { id: "emp-1", name: "Alex Rivera", role: "Technician", techType: "Air", homeCity: "Mesa", homeSite: "site-mesa" },
        { id: "emp-2", name: "Jordan Lee", role: "Lead Tech", techType: "Chiller", homeCity: "Phoenix", homeSite: "site-llano" },
        { id: "emp-3", name: "Sam Patel", role: "Technician", techType: "Air", homeCity: "Toronto", homeSite: "site-tor1a" }
      ],
      assignments: {}
    };

    let data = loadData();
    let currentMonday = getMonday(new Date());

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      d.setHours(0,0,0,0);
      return d;
    }

    function fmt(date) {
      return date.toISOString().slice(0,10);
    }

    function displayDate(date) {
      const day = String(date.getDate()).padStart(2, "0");
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function addDays(date, amount) {
      const d = new Date(date);
      d.setDate(d.getDate() + amount);
      return d;
    }

    function uid(prefix) {
      return prefix + "-" + Math.random().toString(36).slice(2, 9);
    }

    function loadData() {
      const saved = localStorage.getItem("employeeSchedulerData");
      const loaded = saved ? JSON.parse(saved) : structuredClone(demoData);

      loaded.employees = (loaded.employees || []).map(emp => ({
        ...emp,
        techType: emp.techType || "Air",
        homeCity: emp.homeCity || ""
      }));
      loaded.assignments = loaded.assignments || {};
      loaded.sites = loaded.sites || [];

      return loaded;
    }

    function saveData() {
      localStorage.setItem("employeeSchedulerData", JSON.stringify(data));
    }

    function assignmentKey(empId, date) {
      return empId + "|" + date;
    }

    function getAssignment(empId, date) {
      const key = assignmentKey(empId, date);
      const employee = data.employees.find(emp => emp.id === empId);

      if (!data.assignments[key]) {
        data.assignments[key] = {
          employeeId: empId,
          date,
          siteId: employee?.homeSite || "",
          siteWasSet: false,
          status: "Working",
          notes: ""
        };
      } else if (
        data.assignments[key].siteWasSet === undefined &&
        !data.assignments[key].siteId
      ) {
        // Upgrade older saved schedule records so the roster site becomes
        // their initial default. Once the dropdown is changed, siteWasSet
        // prevents the user's choice from being overwritten.
        data.assignments[key].siteId = employee?.homeSite || "";
        data.assignments[key].siteWasSet = false;
      }

      return data.assignments[key];
    }


    let currentView = "detailed";

    function setView(view) {
      currentView = view;
      document.getElementById("detailedView").classList.toggle("hidden", view !== "detailed");
      document.getElementById("compactView").classList.toggle("hidden", view !== "compact");
      document.getElementById("detailedTab").classList.toggle("active", view === "detailed");
      document.getElementById("compactTab").classList.toggle("active", view === "compact");
    }

    function getFilteredEmployees() {
      const siteFilter = document.getElementById("siteFilter").value;
      const techTypeFilter = document.getElementById("techTypeFilter").value;

      return data.employees.filter(emp => {
        const matchesSite = !siteFilter || employeeHasVisibleSiteActivity(emp.id, siteFilter);
        const matchesTechType = !techTypeFilter || emp.techType === techTypeFilter;
        return matchesSite && matchesTechType;
      });
    }

    function renderCompactSchedule() {
      const siteFilter = document.getElementById("siteFilter").value;
      const selectedSiteName = siteFilter
        ? data.sites.find(s => s.id === siteFilter)?.name || "Selected Site"
        : "All Sites";

      const employees = getFilteredEmployees();

      const header = `
        <div class="compact-row">
          <div class="compact-cell day-header">${escapeHtml(selectedSiteName)}</div>
          ${days.map((day, i) => {
            const dayDate = addDays(currentMonday, i);
            return `<div class="compact-cell day-header">${day}<br>${displayDate(dayDate)}</div>`;
          }).join("")}
        </div>`;

      const rows = employees.map(emp => {
        const cells = days.map((_, i) => {
          const date = fmt(addDays(currentMonday, i));
          const a = getAssignment(emp.id, date);
          const site = data.sites.find(s => s.id === a.siteId)?.name || "";
          let status = a.status || "Unassigned";
          if (siteFilter && a.siteId && a.siteId !== siteFilter) status = "Travel";

          return `
            <div class="compact-cell">
              <span class="compact-status ${status}">${escapeHtml(status)}</span>
              ${site ? `<span class="compact-site">${escapeHtml(site)}</span>` : ""}
            </div>`;
        }).join("");

        return `
          <div class="compact-row data-row">
            <div class="compact-cell employee">${escapeHtml(emp.name)}<span class="site-badge">${escapeHtml(data.sites.find(s => s.id === emp.homeSite)?.name || "No site")}</span><span class="tech-type-badge">${escapeHtml(emp.techType || "Air")}</span><small>${escapeHtml(emp.role || "")}</small></div>
            ${cells}
          </div>`;
      }).join("");

      document.getElementById("compactSchedule").innerHTML =
        employees.length ? header + rows : `<div class="toolbar-note">No employees are visible for this site and week.</div>`;
    }


    function renderTodaySummary() {
      const today = new Date();
      const todayKey = fmt(today);
      const siteFilter = document.getElementById("siteFilter").value;

      const visibleEmployees = getFilteredEmployees();

      const counts = {
        Working: 0,
        Vacation: 0,
        Travel: 0,
        Sick: 0,
        Training: 0,
        OFF: 0,
        Unassigned: 0
      };

      visibleEmployees.forEach(emp => {
        const assignment = getAssignment(emp.id, todayKey);
        let status = assignment.status || "Unassigned";

        if (siteFilter && assignment.siteId && assignment.siteId !== siteFilter) {
          status = "Travel";
        }

        if (!(status in counts)) status = "Unassigned";
        counts[status] += 1;
      });

      document.getElementById("todayDateLabel").textContent =
        today.toLocaleDateString(undefined, {
          weekday: "long",
          month: "short",
          day: "numeric"
        });

      const order = ["Working", "Vacation", "Travel", "Sick", "Training", "OFF", "Unassigned"];
      document.getElementById("todayMetrics").innerHTML = order.map(status => `
        <div class="today-metric">
          <div class="today-metric-label">${escapeHtml(status)}</div>
          <div class="today-metric-value">${counts[status]}</div>
        </div>
      `).join("");
    }

    let managementPanelCollapsed =
      localStorage.getItem("managementPanelCollapsed") === "true";

    function applyManagementPanelState() {
      const grid = document.getElementById("schedulerGrid");
      const panel = document.getElementById("managementPanel");
      const collapseButton = document.getElementById("collapsePanelButton");
      const expandButton = document.getElementById("expandPanelButton");

      if (!grid || !panel || !collapseButton || !expandButton) return;

      grid.classList.toggle("management-collapsed", managementPanelCollapsed);
      panel.classList.toggle("collapsed", managementPanelCollapsed);
      collapseButton.setAttribute("aria-expanded", String(!managementPanelCollapsed));
      collapseButton.setAttribute(
        "aria-label",
        managementPanelCollapsed
          ? "Expand roster and sites panel"
          : "Collapse roster and sites panel"
      );
      collapseButton.textContent = managementPanelCollapsed ? "Show" : "Hide Roster";
      collapseButton.classList.toggle("collapsed-label", !managementPanelCollapsed);
      expandButton.classList.toggle("hidden", !managementPanelCollapsed);
    }

    function toggleManagementPanel() {
      managementPanelCollapsed = !managementPanelCollapsed;
      localStorage.setItem(
        "managementPanelCollapsed",
        String(managementPanelCollapsed)
      );
      applyManagementPanelState();
    }

    function render() {
      document.getElementById("weekStart").value = fmt(currentMonday);
      renderSiteDropdowns();
      renderRoster();
      renderSchedule();
      renderCompactSchedule();
      renderTodaySummary();
      renderMetrics();
      applyManagementPanelState();
      saveData();
    }

    function renderSiteDropdowns() {
      const siteFilter = document.getElementById("siteFilter");
      const selectedSite = siteFilter.value;
      const employeeHomeSite = document.getElementById("employeeHomeSite");
      const selectedHomeSite = employeeHomeSite.value;

      const options = [`<option value="">All Sites / Master View</option>`].concat(data.sites.map(s => `<option value="${s.id}">${s.name}</option>`)).join("");
      siteFilter.innerHTML = options;

      if (selectedSite && data.sites.some(s => s.id === selectedSite)) {
        siteFilter.value = selectedSite;
      } else {
        siteFilter.value = "";
      }

      employeeHomeSite.innerHTML = data.sites.map(s => `<option value="${s.id}">${s.name}</option>`).join("");

      if (selectedHomeSite && data.sites.some(s => s.id === selectedHomeSite)) {
        employeeHomeSite.value = selectedHomeSite;
      }
    }

    function renderRoster() {
      const employeeList = document.getElementById("employeeList");
      employeeList.innerHTML = data.employees.map(emp => {
        const site = data.sites.find(s => s.id === emp.homeSite)?.name || "No site";
        return `<div class="person">
          <div>
            ${emp.name}
            <span class="site-badge">${site}</span>
            <span class="tech-type-badge">${escapeHtml(emp.techType || "Air")}</span>
            <small>${escapeHtml(emp.role || "No role")}${emp.homeCity ? ` • ${escapeHtml(emp.homeCity)}` : ""}</small>
          </div>
          <div class="person-actions">
            <button class="secondary" onclick="modifyEmployee('${emp.id}')">Modify</button>
            <button class="secondary" onclick="removeEmployee('${emp.id}')">Remove</button>
          </div>
        </div>`;
      }).join("");

      const siteList = document.getElementById("siteList");
      siteList.innerHTML = data.sites.map(site => `
        <div class="person">
          <div>${site.name}<small>Site</small></div>
          <div class="person-actions">
            <button class="secondary" onclick="modifySite('${site.id}')">Modify</button>
            <button class="secondary" onclick="removeSite('${site.id}')">Remove</button>
          </div>
        </div>
      `).join("");
    }

    function renderSchedule() {
      const siteFilter = document.getElementById("siteFilter").value;

      const employees = getFilteredEmployees();

      const selectedSiteName = siteFilter
        ? data.sites.find(s => s.id === siteFilter)?.name || "Selected Site"
        : "All Sites / Master View";

      const dateHeaders = days.map((day, i) => {
        const d = addDays(currentMonday, i);
        return `<th>${day}<br>${displayDate(d)}</th>`;
      }).join("");

      if (employees.length === 0 && siteFilter) {
        document.getElementById("scheduleTable").innerHTML = `
          <thead><tr><th>${selectedSiteName}</th>${dateHeaders}</tr></thead>
          <tbody>
            <tr>
              <td colspan="8" style="padding:22px;background:white;color:var(--muted);font-weight:600;">
                No employees currently have ${selectedSiteName} as their home site or scheduled activity for this week.
              </td>
            </tr>
          </tbody>`;
        return;
      }

      const rows = employees.map(emp => {
        const cells = days.map((_, i) => {
          const date = fmt(addDays(currentMonday, i));
          const a = getAssignment(emp.id, date);

          if (siteFilter && a.siteId && a.siteId !== siteFilter) {
            const otherSite = data.sites.find(s => s.id === a.siteId)?.name || "Another site";
            return `<td>
              <div class="cell">
                <span class="pill Travel">Other Site</span>
                <div class="hours">${emp.name} is assigned to ${otherSite} this day.</div>
              </div>
            </td>`;
          }

          if (siteFilter && !a.siteId && emp.homeSite !== siteFilter) {
            return `<td>
              <div class="cell">
                <span class="pill Unassigned">No ${selectedSiteName} Activity</span>
              </div>
            </td>`;
          }

          return `<td data-day="${days[i]} ${displayDate(addDays(currentMonday, i))}">
            <div class="cell">
              <span class="pill ${a.status}">${a.status}</span>
              <select onchange="updateAssignment('${emp.id}','${date}','status',this.value)">
                ${statuses.map(st => `<option ${a.status === st ? "selected" : ""}>${st}</option>`).join("")}
              </select>
              <select onchange="updateAssignment('${emp.id}','${date}','siteId',this.value)">
                <option value="">No site</option>
                ${data.sites.map(site => `<option value="${site.id}" ${a.siteId === site.id ? "selected" : ""}>${site.name}</option>`).join("")}
              </select>
              <input value="${escapeHtml(a.notes || "")}" placeholder="Notes" onchange="updateAssignment('${emp.id}','${date}','notes',this.value)" />
            </div>
          </td>`;
        }).join("");

        const homeSite = data.sites.find(s => s.id === emp.homeSite)?.name || "No home site";
        return `<tr><td><strong>${emp.name}</strong><span class="site-badge">${homeSite}</span><span class="tech-type-badge">${escapeHtml(emp.techType || "Air")}</span><br><span class="hours">${emp.role || ""}</span></td>${cells}</tr>`;
      }).join("");

      document.getElementById("scheduleTable").innerHTML = `<thead><tr><th>${selectedSiteName}</th>${dateHeaders}</tr></thead><tbody>${rows}</tbody>`;
    }

    function employeeHasVisibleSiteActivity(empId, siteId) {
      const weekDates = days.map((_, i) => fmt(addDays(currentMonday, i)));
      const emp = data.employees.find(e => e.id === empId);
      if (emp?.homeSite === siteId) return true;

      return Object.values(data.assignments).some(a =>
        a.employeeId === empId &&
        weekDates.includes(a.date) &&
        a.siteId === siteId
      );
    }

    function hasAssignmentAtSite(empId, siteId) {
      return Object.values(data.assignments).some(a => a.employeeId === empId && a.siteId === siteId);
    }

    function renderMetrics() {
      const weekStart = currentMonday;
      const weekEnd = addDays(currentMonday, 6);
      const sameYear = weekStart.getFullYear() === weekEnd.getFullYear();
      const startText = weekStart.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: sameYear ? undefined : "numeric"
      });
      const endText = weekEnd.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      const weekDateLabel = document.getElementById("weekDateLabel");
      if (weekDateLabel) {
        weekDateLabel.textContent = `${startText} – ${endText}`;
      }

      const siteFilter = document.getElementById("siteFilter").value;
      const visibleEmployees = getFilteredEmployees();
      let unassigned = 0;
      let travel = 0;
      let vacation = 0;

      visibleEmployees.forEach(emp => {
        days.forEach((_, i) => {
          const date = fmt(addDays(currentMonday, i));
          const assignment = getAssignment(emp.id, date);
          let status = assignment.status || "Working";

          if (siteFilter && assignment.siteId && assignment.siteId !== siteFilter) {
            status = "Travel";
          }

          if (status === "Unassigned") unassigned++;
          if (status === "Travel") travel++;
          if (status === "Vacation") vacation++;
        });
      });

      document.getElementById("metricUnassigned").textContent = unassigned;
      document.getElementById("metricTravel").textContent = travel;
      document.getElementById("metricVacation").textContent = vacation;
    }

    function updateAssignment(empId, date, field, value) {
      const a = getAssignment(empId, date);
      a[field] = value;

      if (field === "siteId") {
        a.siteWasSet = true;
      }

      render();
    }

    let editingEmployeeId = null;

    function saveEmployee() {
      const name = document.getElementById("employeeName").value.trim();
      if (!name) {
        alert("Employee name cannot be blank.");
        return;
      }

      const values = {
        name,
        role: document.getElementById("employeeRole").value.trim(),
        techType: document.getElementById("employeeTechType").value,
        homeCity: document.getElementById("employeeHomeCity").value.trim(),
        homeSite: document.getElementById("employeeHomeSite").value
      };

      if (editingEmployeeId) {
        const emp = data.employees.find(e => e.id === editingEmployeeId);
        if (!emp) return;
        Object.assign(emp, values);
      } else {
        data.employees.push({ id: uid("emp"), ...values });
      }

      cancelEmployeeEdit(false);
      render();
    }

    function modifyEmployee(id) {
      const emp = data.employees.find(e => e.id === id);
      if (!emp) return;

      editingEmployeeId = id;
      document.getElementById("employeeName").value = emp.name;
      document.getElementById("employeeRole").value = emp.role || "";
      document.getElementById("employeeTechType").value = emp.techType || "Air";
      document.getElementById("employeeHomeCity").value = emp.homeCity || "";
      document.getElementById("employeeHomeSite").value = emp.homeSite || "";
      document.getElementById("employeeSaveButton").textContent = "Save Employee";
      document.getElementById("employeeCancelButton").classList.remove("hidden");
      document.getElementById("employeeName").focus();
    }

    function cancelEmployeeEdit(shouldRender = true) {
      editingEmployeeId = null;
      document.getElementById("employeeName").value = "";
      document.getElementById("employeeRole").value = "";
      document.getElementById("employeeTechType").value = "Air";
      document.getElementById("employeeHomeCity").value = "";
      document.getElementById("employeeSaveButton").textContent = "Add Employee";
      document.getElementById("employeeCancelButton").classList.add("hidden");
      if (shouldRender) render();
    }

    function removeEmployee(id) {
      data.employees = data.employees.filter(e => e.id !== id);
      Object.keys(data.assignments).forEach(k => {
        if (data.assignments[k].employeeId === id) delete data.assignments[k];
      });
      render();
    }

    let editingSiteId = null;

    function saveSite() {
      const name = document.getElementById("siteName").value.trim();
      if (!name) {
        alert("Site name cannot be blank.");
        return;
      }

      if (editingSiteId) {
        const site = data.sites.find(s => s.id === editingSiteId);
        if (!site) return;
        site.name = name;
      } else {
        data.sites.push({ id: uid("site"), name });
      }

      cancelSiteEdit(false);
      render();
    }

    function modifySite(id) {
      const site = data.sites.find(s => s.id === id);
      if (!site) return;

      editingSiteId = id;
      document.getElementById("siteName").value = site.name;
      document.getElementById("siteSaveButton").textContent = "Save Site";
      document.getElementById("siteCancelButton").classList.remove("hidden");
      document.getElementById("siteName").focus();
    }

    function cancelSiteEdit(shouldRender = true) {
      editingSiteId = null;
      document.getElementById("siteName").value = "";
      document.getElementById("siteSaveButton").textContent = "Add Site";
      document.getElementById("siteCancelButton").classList.add("hidden");
      if (shouldRender) render();
    }

    function removeSite(id) {
      data.sites = data.sites.filter(s => s.id !== id);
      data.employees.forEach(e => { if (e.homeSite === id) e.homeSite = ""; });
      Object.values(data.assignments).forEach(a => { if (a.siteId === id) a.siteId = ""; });
      render();
    }

    function changeWeek(days) {
      currentMonday = addDays(currentMonday, days);
      render();
    }

    function setWeekFromInput() {
      currentMonday = getMonday(new Date(document.getElementById("weekStart").value));
      render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "employee-scheduler-data.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          data = JSON.parse(reader.result);
          saveData();
          render();
        } catch {
          alert("Could not import file. Please use a valid scheduler JSON export.");
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }

    document.getElementById("employeeName").addEventListener("keydown", e => {
      if (e.key === "Enter") saveEmployee();
    });
    document.getElementById("employeeRole").addEventListener("keydown", e => {
      if (e.key === "Enter") saveEmployee();
    });
    document.getElementById("siteName").addEventListener("keydown", e => {
      if (e.key === "Enter") saveSite();
    });

    render();
  </script>
</body>
</html>
